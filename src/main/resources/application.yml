spring:
  application:
    name: "1БКС24044"

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: true

server:
  # HTTPS (TLS) на порту 8443; сертификат сервера выпущен собственной цепочкой CA.
  port: 8443
  ssl:
    enabled: true
    key-store: classpath:1bks24044-server.p12
    key-store-type: PKCS12
    # Пароль хранилища (он же пароль ключа) задаётся переменной окружения.
    key-store-password: ${SSL_KEYSTORE_PASSWORD}
    key-alias: "1bks24044-server"

jwt:
  # Ключ HS256 задаётся переменной окружения, длина не менее 32 байт.
  secret: ${JWT_SECRET}
  # Время жизни access-токена: 15 минут.
  access-token-ttl-seconds: 900
  # Время жизни refresh-токена: 7 суток.
  refresh-token-ttl-seconds: 604800
